<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de cadastro</title>
</head>
<body>
    <form>
        <h1 style="color:#ff0000; font-weight: bolder;">Formulário de Cadastro!</h1>
            <br/>
        <label style="color:#4c00ff; font-weight: bolder; text-decoration: underline;" for="nome">Digite seu nome:</label>
        <input id="nome" placeholder="Nome Completo">
            <br/>
        <label style="color:#4c00ff; font-weight: bolder; text-decoration: underline;" for="email">Digite seu e-mail:</label>
        <input id="email" placeholder="email">
            <br/>
        <label style="color:#4c00ff; font-weight: bolder; text-decoration: underline;" for="senha">Digite a sua senha:</label>
        <input id="senha" type="password" placeholder="Sua senha">
            <br/>
        <button type="submit">
            Cadastrar!
        </button>
        <button type="reset">
            Limpar!
        </button>
    </form>
    <hr/>
</body>
</html>
